version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: picabo_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: picabo
      POSTGRES_USER: picabo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picabo_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - picabo_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U picabo -d picabo']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: picabo_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - picabo_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: picabo_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./apps/backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - picabo_network

  admin:
    build:
      context: apps/admin
      dockerfile: Dockerfile
    container_name: picabo_admin
    restart: unless-stopped
    ports:
      - '3001:3001'
    depends_on:
      - backend
    env_file:
      - .env
    networks:
      - picabo_network

networks:
  picabo_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
